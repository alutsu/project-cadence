# Publishes the playable build to GitHub Pages.
#
# The M0 gate (docs/M0_GATE.md) needs twenty minutes from someone who has not
# read the GDD. Asking that person to clone a repo and run a dev server changes
# what is being tested, so the build has to live at a URL.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Read the repo, mint the token Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate a change has to pass locally (CLAUDE.md §8). A broken
      # build must never reach the URL an outsider is asked to play.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
